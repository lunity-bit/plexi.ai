<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Plexi</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: #000;
            color: white;
            font-family: Arial, sans-serif;
            height: 100vh;
            overflow: hidden;
        }

        .space {
            position: fixed;
            inset: 0;
            overflow: hidden;
            pointer-events: none;
        }

        .star {
            position: absolute;
            width: 1px;
            height: 1px;
            background: white;
            border-radius: 50%;
            animation: starMove linear infinite;
        }

        @keyframes starMove {
            from {
                transform: translate(0, 0);
                opacity: 0;
            }

            20% {
                opacity: .6;
            }

            80% {
                opacity: .6;
            }

            to {
                transform: translate(180px, 180px);
                opacity: 0;
            }
        }

        .app {
            position: relative;
            z-index: 5;
            height: 100vh;

            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .logo {
            font-size: 64px;
            font-weight: 700;
            letter-spacing: -3px;
            margin-bottom: 35px;
        }

        .chat-box {
            width: min(700px, 90%);
            display: flex;
            gap: 10px;
        }

        #message {
            flex: 1;
            height: 52px;

            background: #111;
            color: white;

            border: 1px solid #333;
            border-radius: 14px;

            padding: 0 18px;
            outline: none;

            font-size: 16px;
        }

        #message:focus {
            border-color: #666;
        }

        #send {
            width: 52px;
            height: 52px;

            border: none;
            border-radius: 14px;

            background: white;
            color: black;

            font-size: 20px;
            cursor: pointer;
        }

        #send:hover {
            background: #ddd;
        }

        #response {
            width: min(700px, 90%);
            max-height: 300px;

            margin-top: 25px;

            overflow-y: auto;

            color: #ddd;
            line-height: 1.5;
            text-align: left;
        }
    </style>
</head>

<body>

    <div class="space" id="space"></div>

    <main class="app">

        <div class="logo">Plexi</div>

        <div class="chat-box">

            <input
                id="message"
                type="text"
                placeholder="Plexi'ye bir şey sor..."
                autocomplete="off"
            >

            <button id="send">↑</button>

        </div>

        <div id="response"></div>

    </main>


    <script>

        /* YILDIZLAR */

        const space = document.getElementById("space");

        for (let i = 0; i < 80; i++) {

            const star = document.createElement("div");

            star.className = "star";

            star.style.left =
                Math.random() * 100 + "%";

            star.style.top =
                Math.random() * 100 + "%";

            star.style.animationDuration =
                (4 + Math.random() * 8) + "s";

            star.style.animationDelay =
                Math.random() * 8 + "s";

            space.appendChild(star);
        }


        /* CHAT */

        const message = document.getElementById("message");
        const send = document.getElementById("send");
        const response = document.getElementById("response");


        async function sendMessage() {

            const text = message.value.trim();

            if (!text) {
                return;
            }

            response.textContent = "Düşünüyor...";
            message.value = "";

            try {

                const result = await fetch("/chat", {

                    method: "POST",

                    headers: {
                        "Content-Type": "application/json"
                    },

                    body: JSON.stringify({
                        message: text
                    })

                });


                const data = await result.json();


                if (data.response) {

                    response.textContent =
                        data.response;

                } else {

                    response.textContent =
                        "Bir hata oluştu.";

                }

            } catch (error) {

                response.textContent =
                    "Sunucuya bağlanılamadı.";

                console.error(error);
            }
        }


        send.addEventListener(
            "click",
            sendMessage
        );


        message.addEventListener(
            "keydown",
            function(event) {

                if (event.key === "Enter") {
                    sendMessage();
                }

            }
        );

    </script>

</body>
</html>
