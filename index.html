<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Plexi</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 100%;
            height: 100vh;
            overflow: hidden;
            background: #000;
            color: white;
            font-family: Arial, sans-serif;
        }

        /* Yıldız alanı */
        .space {
            position: fixed;
            inset: 0;
            overflow: hidden;
            pointer-events: none;
        }

        .star {
            position: absolute;
            width: 2px;
            height: 2px;
            background: white;
            border-radius: 50%;
            opacity: 0.7;

            animation: moveStar linear infinite;
        }

        @keyframes moveStar {
            from {
                transform: translate(0, 0);
                opacity: 0;
            }

            20% {
                opacity: 0.7;
            }

            80% {
                opacity: 0.7;
            }

            to {
                transform: translate(180px, 180px);
                opacity: 0;
            }
        }

        /* Ana içerik */
        .center {
            position: relative;
            z-index: 10;

            width: 100%;
            height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;
        }

        .logo {
            font-size: 64px;
            font-weight: 700;
            letter-spacing: -3px;

            user-select: none;
        }
    </style>
</head>

<body>

    <div class="space" id="space"></div>

    <main class="center">
        <div class="logo">Plexi</div>
    </main>

    <script>
        const space = document.getElementById("space");

        const STAR_COUNT = 80;

        for (let i = 0; i < STAR_COUNT; i++) {

            const star = document.createElement("div");

            star.className = "star";

            star.style.left =
                Math.random() * 100 + "%";

            star.style.top =
                Math.random() * 100 + "%";

            star.style.animationDuration =
                (4 + Math.random() * 8) + "s";

            star.style.animationDelay =
                (Math.random() * 8) + "s";

            const size =
                Math.random() > 0.85 ? 2 : 1;

            star.style.width = size + "px";
            star.style.height = size + "px";

            space.appendChild(star);
        }
    </script>

</body>
</html>
